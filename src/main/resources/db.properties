# =======================================================================
# Cấu hình kết nối SQL Server cho Manage Electronics
# (Có thể ghi đè bằng biến môi trường DB_USER, DB_PASSWORD, DB_HOST, ...
#  hoặc đặt file này tại $CATALINA_BASE/conf/db.properties khi đã deploy.)
# Hầu hết máy KHÔNG cần sửa gì: nếu mật khẩu sa là 123456 hoặc 123 thì chạy luôn.
# =======================================================================
db.user=sa
db.password=123456
db.host=localhost
db.port=1433
db.name=Manage_Electronics

# Mật khẩu dự phòng tự thử khi db.password bị từ chối (cách nhau bằng dấu phẩy, để trống để tắt)
db.fallbackPasswords=123456,123

# Tên instance thử thêm khi cổng 1433 không phản hồi (SQL Server Express mặc định là SQLEXPRESS)
db.instance=SQLEXPRESS

# true: tự chạy Manage_Electronics.sql để tạo database + dữ liệu mẫu nếu database chưa tồn tại
db.autoinit=true

# (Tùy chọn) Chuỗi kết nối JDBC đầy đủ - nếu đặt thì bỏ qua host/port/instance
# db.url=jdbc:sqlserver://localhost:1433;databaseName=Manage_Electronics;encrypt=false;trustServerCertificate=true;
